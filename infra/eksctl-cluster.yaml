apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: orbit-eks
  region: ap-south-1
  version: "1.31"
  tags:
    Project: orbit-mvp
    Owner: sipun

iam:
  withOIDC: true

managedNodeGroups:
  - name: orbit-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    ssh:
      allow: false
    tags:
      Project: orbit-mvp
      nodegroup-role: worker
    iam:
      withAddonPolicies:
        autoScaler: true
        albIngress: true
        cloudWatch: true
